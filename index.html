at(3,minmax(0,1fr));gap:8px;margin:16px 0}.stat{background:#e8f0e9;border-radius:12px;padding:13px 10px}.stat strong{display:block;font-size:23px;margin-bottom:3px}.stat small{font-size:12px;color:#567368}.bar{width:100%;height:9px;background:#dce9de;border-radius:9px;overflow:hidden}.bar>div{background:#328273;height:100%;width:0}.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:46px;padding:12px 16px;border-radius:12px;border:1px solid #23564c;background:var(--green);color:white;text-decoration:none;font-weight:650;line-height:1.35}.btn.alt{background:#edf4ef;color:#215a50;border-color:#cfddd4}.btn.flat{background:white;color:var(--green);border-color:#d9e5df}.btn.small{min-height:42px;font-size:14px;padding:9px 11px}.btn.full{width:100%}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.actions>*{flex:1}.listrow{border:1px solid var(--line);border-radius:13px;background:white;padding:15px;margin:10px 0;display:block;color:var(--fg);text-decoration:none}.listrow:active{background:#e9f1ea}.lessonname{font-size:17px;font-weight:700;line-height:1.45;margin:4px 0}.listrow small{color:var(--muted);font-size:13px}.chip{display:inline-flex;align-items:center;border-radius:40px;padding:5px 10px;background:#e8eee7;color:#385b4f;font-size:12px;font-weight:700;margin-right:6px}.chip.done{background:#dcefe0;color:#24724a}.search{width:100%;border:1px solid #c5d8cc;border-radius:12px;padding:14px;font-size:16px;background:white}.filterrow{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px}.filterrow button{white-space:nowrap;background:#e7eeea;border:1px solid #cddfd5;border-radius:20px;min-height:41px;padding:9px 15px;color:#3c5d52}.filterrow button.on{background:#245a50;color:white}.bottom{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#fffefaef;backdrop-filter:blur(15px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.bottominside{max-width:700px;display:grid;grid-template-columns:repeat(5,1fr);margin:0 auto}.bottom button{border:none;background:none;min-height:66px;font-size:11px;color:#61766c;padding:9px 0 6px}.bottom button b{display:block;font-size:21px;line-height:1.2;margin:0 0 5px;font-weight:400}.bottom button.on{color:#1e6154;font-weight:750}.back{display:inline-flex;align-items:center;min-height:40px;font-size:14px;text-decoration:none;margin-bottom:8px}.lessonmeta{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}.note{border-top:1px solid #e4ece6;padding:14px 0;line-height:1.83}.note:first-of-type{border-top:0}.note b{font-size:12px;color:#5b7b6d}.memory{background:#eff6ee;border-left:3px solid #75a58c;padding:11px 14px;margin:9px 0;border-radius:9px;line-height:1.75;font-weight:600}details{border:1px solid #d6e3d9;border-radius:13px;padding:14px;margin:10px 0;background:white}summary{cursor:pointer;line-height:1.7;font-weight:650;min-height:30px}details .answer{margin-top:12px;padding:12px;background:#eaf2e9;border-radius:9px;line-height:1.8}.source{padding:12px;margin:10px 0;background:#eff4ee;border-radius:10px;line-height:1.6}.source a{font-weight:750}.source small{display:block;color:#587168}.tablewrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}table{border-collapse:collapse;min-width:550px;width:100%}td,th{border-bottom:1px solid #e1eae3;text-align:left;vertical-align:top;padding:11px 9px;font-size:14px;line-height:1.65}th{background:#eaf1ec}.flash{min-height:235px;width:100%;border:2px solid #a6c4b3;border-radius:18px;background:#f0f7f1;padding:25px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:21px;line-height:1.6;color:var(--fg)}.flash.revealed{background:#fff7e8;border-color:#d3b77a}.flash .hint{font-size:12px;font-weight:500;color:var(--muted);margin-top:18px}.mini{padding:10px;border-radius:9px;background:#eef4ee;margin:9px 0;line-height:1.65}.grow{flex:1}.line{height:1px;background:var(--line);margin:18px 0}.checklabel{display:flex;align-items:center;gap:9px;line-height:1.5;font-weight:650}.checklabel input{width:22px;height:22px;accent-color:#287e67}.field{display:block;font-weight:650;margin:8px 0 5px}.select{width:100%;padding:12px;border:1px solid #c9dacf;border-radius:12px;background:white;font-size:16px}.phase{border:1px solid var(--line);background:white;border-radius:12px;padding:15px;margin:10px 0}.phase h3{margin:0 0 10px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:7px;font-size:14px;line-height:1.7}.columns span:nth-child(odd){color:var(--muted)}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}@media(min-width:730px){.hero{font-size:37px}.panel{padding:25px}main{padding:30px}.bottominside{max-width:700px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}@media print{.bottom,.head,.actions{display:none}.shell{padding-bottom:0}main{max-width:100%}}
</style></head><body><div id="app"></div><script>window.STUDY={"lessons":[{"id":"F01","stage":"初階","topic":"學習方法","title":"如何使用這套教材與建立安全觀念","minutes":35,"goal":"先分清楚「原典、課堂筆記、現代臨床證據」三種不同層次。","notes":["第一層是學校指定教材與實際授課：現代解剖、生理、感染控制、知情同意、穴位定位及轉介判斷以此為優先。第二層是《黃帝內經》《針灸大成》等歷史原典：用來理解中醫術語與思想史。第三層是倪氏講稿：屬特定老師的講解、詮釋與臨床主張，不能與原典或科學證據畫上等號。","閱讀一章的順序：①看本手冊 ②合上頁面說出三個概念 ③做三題測驗 ④需要深究時點「原書頁碼」。不要從頭到尾逐字抄書；目標是能夠用自己的語言重建概念。","穴位名稱、經絡理論與臨床針刺是不同層次：能背出穴名，不等於能在人體上安全操作。避免把書中急救、癌症治療、孕期刺灸及藥物處方當成可自行實施的做法。","每次學習只保留三種筆記：①一句話定義 ②一張比較表 ③三個閉卷問題；複習在第1、3、7、14、30天進行。"],"memorize":["先學現代安全，再學古籍理論","原文≠老師詮釋≠醫學證據","每天20+10+5+5分鐘"],"questions":[["「讀懂」與「背得出」差別是什麼？","能不看資料自行解釋、比較並答題，才算可回憶。"],["醫案是否能單獨證明療效？","不能，個案缺乏充分對照，需評估偏差、替代解釋與現代研究。"],["定位穴位時應優先依什麼？","正式學校教材、現代解剖及專業安全標準。"]],"read":[["A",14,"歷史針刺定位講義：只作比較"]],"terms":[["Evidence","證據"],["Contraindication","禁忌"],["Referral","轉介"]],"contrast":"","practice":"今天先完成初階第一章，自測三題，建立自己的學習紀錄。"},{"id":"F02","stage":"初階","topic":"陰陽","title":"陰陽的四個核心關係","minutes":40,"goal":"把陰陽看成「相對功能與變化」的語言，而非兩種固定物質。","notes":["陰陽是一套描述事物相對屬性與變動關係的模型。例如熱與寒、動與靜、外與內可以作陰陽對照，但必須說清楚比較對象與情境。","對立制約（opposition）：兩面相互制約；互根互用（interdependence）：任何一方需另一方作為比較及維持條件；消長平衡（waxing and waning）：比例隨情境而變；相互轉化（transformation）：在特定條件下性質可轉向。","中醫所說「陰虛」「陽虛」是傳統證候推理的一部分，不能直接等同荷爾蒙不足、某個器官病變或現代醫學診斷。","《素問·生氣通天論》名句「陰平陽秘，精神乃治；陰陽離決，精氣乃絕」重點在描述調和與失衡的理論。把古文先轉成白話：陰與陽相互調節，生命活動才較能維持協調。"],"memorize":["四個字串：對立、互根、消長、轉化","陰陽要說明「跟什麼比較」","陰平陽秘見《素問·生氣通天論》"],"questions":[["列出陰陽四個核心關係。","對立制約、互根互用、消長平衡、相互轉化。"],["「熱就是陽」是否在所有語境都不變？","不是；陰陽屬相對範疇，需說明比較尺度與情境。"],["「陰平陽秘」在講什麼？","以古典語言形容陰陽相互維持協調的狀態。"]],"read":[["N",12,"《生氣通天論》篇第三"],["N",26,"《陰陽應象大論》篇第五"],["N",42,"《陰陽離合論》篇第六"]],"terms":[["Yin–Yang","陰陽"],["Mutual dependence","互根互用"],["Transformation","相互轉化"]],"contrast":"","practice":"閉卷寫出四個關係，為每個關係各舉一個非醫療例子。"},{"id":"F03","stage":"初階","topic":"五行","title":"五行相生、相剋與相乘相侮","minutes":40,"goal":"不用死記五條箭頭，而要能從一個元素推得其他關係。","notes":["五行是木、火、土、金、水，用來分類功能、性質與相互作用，不是把五種元素當作生化物質。","相生：木生火、火生土、土生金、金生水、水生木。相剋：木剋土、土剋水、水剋火、火剋金、金剋木。","相乘：沿正常相剋方向出現過度制約；相侮：反向制約，例如按五行模型「木本受金剋」，若木反向制約金，稱為木侮金。這些是傳統理論描述，不能直接從五行推出具體疾病。","練習推導：選「木」，問它生誰？火；誰生它？水；它剋誰？土；誰剋它？金。四個問題每個元素都要答得出來。"],"memorize":["相生：木火土金水（循環）","相剋：木土水火金（循環）","相乘＝過度相剋；相侮＝反向制約"],"questions":[["相生由「金」接到哪一行？","水。"],["「土」剋誰？","水。"],["相乘與相侮如何區分？","相乘是沿相剋路徑過強；相侮是反向克制。"]],"read":[["N",20,"《金匱真言論》篇第四"],["N",26,"《陰陽應象大論》篇第五"]],"terms":[["Five phases","五行"],["Generating cycle","相生"],["Controlling cycle","相剋"]],"contrast":"","practice":"用空白紙畫生剋兩個圓，反覆默寫到不需看答案。"},{"id":"F04","stage":"初階","topic":"五行","title":"五行對應：五臟、六腑、五官、五志與五液","minutes":45,"goal":"學會一張能延伸到各個臟腑章的必背總表。","notes":["木：肝／膽；目；筋；淚；怒；春；青；酸；魂。火：心／小腸；舌；脈；汗；喜；夏；赤；苦；神。","土：脾／胃；口；肌肉；涎；思；長夏；黃；甘；意。金：肺／大腸；鼻；皮毛；涕；悲／憂；秋；白；辛；魄。水：腎／膀胱；耳；骨；唾；恐；冬；黑；鹹；志。","記憶時優先三層：第一層「臟、腑、官、情志」；第二層「體、液、季、味、色」；第三層「五神」。因各派和古籍表述可能略有差異，答案需標註採用哪本課本。","心包與三焦是十二經的重要成員，但並非所有簡化版五行表都以相同方式列入五臟六腑對應；學習時另外記錄。"],"memorize":["木肝膽目怒；火心小腸舌喜；土脾胃口思；金肺大腸鼻悲；水腎膀胱耳恐","五液：淚汗涎涕唾","五神：魂神意魄志"],"questions":[["脾屬何行？所主的感官開竅？","土，口。"],["五液配對順序？","木淚、火汗、土涎、金涕、水唾。"],["水的五神與情志？","志、恐。"]],"read":[["N",20,"《金匱真言論》篇第四"],["N",65,"《五藏生成》篇第十"]],"terms":[["Correspondence","類屬／對應"],["Five spirits","五神"],["Body fluids","五液"]],"contrast":"","practice":"把五行表遮住，只看「木火土金水」，填完整十欄；隔天再測一次。"},{"id":"F05","stage":"初階","topic":"氣血津液","title":"氣、血、津液與精：功能和差別","minutes":40,"goal":"能清楚區分四個傳統生理學詞彙，而不混同於現代解剖物質。","notes":["氣 Qi：用以描述生命活動、運行與功能的傳統概念。常見作用為推動、溫煦、防禦、固攝、氣化；氣機有升、降、出、入四方向。","血 Xue：中醫討論其濡養、滋潤與承載神志相關功能；不能直接把中醫「血虛」當作現代血球數值異常。","津液 Jin-Ye：體液與滋潤的傳統分類，常分津較清稀、液較濃稠；生理與病機需理解運化、輸布與排泄關聯。","精 Jing：與生長、發育、生殖及腎的藏精理論相連。中醫的「精」不是單指生殖細胞，也不是單一荷爾蒙。","把四者做成比較表：定義、來源、功能、相關臟腑、常見失衡、不能和西醫一一對應的概念。"],"memorize":["氣五作用：推動、溫煦、防禦、固攝、氣化","氣機四方向：升降出入","氣、血、津液、精要分開定義"],"questions":[["氣機有哪些運動方向？","升、降、出、入。"],["中醫「血虛」能否直接等於貧血？","不能，需按不同診斷系統分別評估。"],["精與津液的主要概念差異？","精側重生長發育與生命根本，津液側重滋養濡潤和體液代謝。"]],"read":[["N",12,"《生氣通天論》"],["N",147,"《經脈別論》"]],"terms":[["Qi","氣"],["Xue","血"],["Jin-Ye","津液"],["Jing","精"]],"contrast":"","practice":"給每個詞寫一句你自己的定義，再比較和西醫用語最大的不同。"},{"id":"F06","stage":"初階","topic":"藏象","title":"心與心包：主血脈、藏神、代心受邪","minutes":40,"goal":"對照學校已學的 Heart / Pericardium 主題。","notes":["中醫心（Heart）主血脈、藏神，開竅於舌，其華在面，液為汗，體合脈。這是藏象系統，不能直接化約成心臟解剖功能。","中醫心包（Pericardium）在傳統文獻中常被描述為護衛心、代心受邪的功能位置；十二經脈系統中的手厥陰心包經，需要與手少陰心經分開記。","心、心包與三焦的配對：心—小腸；心包—三焦。不要把心包理解成「第二個心臟」，也不能用心包系統替代心臟疾病的醫學診斷。","比較練習：寫出心、心包的傳統功能、相表裡腑、所屬經脈及現代解剖名詞。兩個詞相似，但傳統概念與解剖實體不完全重合。"],"memorize":["心主血脈、藏神、開竅於舌","心—小腸；心包—三焦","心經≠心包經"],"questions":[["心主什麼？","主血脈、藏神（傳統藏象論述）。"],["心包經的表裡經是哪一經？","手少陽三焦經。"],["「心包」是否等同西醫解剖的全部心包膜功能？","不是；傳統功能概念與解剖學名詞須區分。"]],"read":[["N",51,"《靈蘭秘典論》"],["A",76,"手少陰心經"],["A",120,"手厥陰心包經"]],"terms":[["Heart","心"],["Pericardium","心包"],["Shen","神"]],"contrast":"","practice":"把你之前的心與心包課堂講義放在左右兩欄，標記相同概念及不同定義。"},{"id":"F07","stage":"初階","topic":"藏象","title":"肝、脾、肺、腎四臟總論","minutes":45,"goal":"用「主要傳統功能＋開竅＋主體＋情志」理解四臟。","notes":["肝 Liver：主疏泄、藏血；開竅於目、在體合筋，情志與怒關聯。疏泄可理解為傳統氣機調暢模型，不是單純肝臟解毒功能。","脾 Spleen：主運化、統血，主肌肉四肢，開竅於口。中醫「脾」的運化與現代脾臟的免疫功能不是一回事。","肺 Lung：主氣司呼吸、宣發肅降，通調水道、朝百脈、主治節；開竅於鼻，合皮毛。宣發與肅降是一對互補的功能方向。","腎 Kidney：藏精、主生長發育生殖、主水、納氣，主骨生髓、開竅於耳。中醫「腎精」不是單一現代生化指標。","四臟一張表：核心功能、開竅、體合、情志、表裡腑、學校教材對應章節。"],"memorize":["肝：疏泄／藏血","脾：運化／統血","肺：宣發／肅降","腎：藏精／主水／納氣"],"questions":[["哪一臟主運化？","脾。"],["肺的兩種氣機作用方向？","宣發、肅降。"],["腎的三項傳統功能？","藏精、主水、納氣。"]],"read":[["N",54,"《六節藏象論》"],["N",65,"《五藏生成》"]],"terms":[["Liver","肝"],["Spleen","脾"],["Lung","肺"],["Kidney","腎"]],"contrast":"","practice":"四臟各用一句話定義，再用英文說出主功能。"},{"id":"F08","stage":"初階","topic":"藏象","title":"六腑與三焦：傳化物而不藏","minutes":35,"goal":"明確說出六腑及其和五臟的表裡關係。","notes":["六腑通常列膽、胃、小腸、大腸、膀胱、三焦。中醫有「六腑以通為用」的教學概括，強調傳化、運行與通降；這是功能分類，不可與現代器官消化生理一對一套合。","五臟表裡配對：肝—膽、心—小腸、脾—胃、肺—大腸、腎—膀胱；心包—三焦是十二經循行的表裡配對。","三焦 San Jiao 不是現代解剖學一個可孤立的器官；傳統有上焦、中焦、下焦的功能分區描述。把「上焦如霧，中焦如漚，下焦如瀆」作為形象比喻理解，而不是物理構造。","奇恆之腑（如腦、髓、骨、脈、膽、女子胞）與六腑分類不同；膽會出現在兩種分類中，學習時要記得傳統理論的分類依據。"],"memorize":["膽胃小腸大腸膀胱三焦","五臟六腑表裡＋心包三焦","上焦／中焦／下焦"],"questions":[["三焦在現代解剖是單一器官嗎？","不是。"],["肺的表裡腑為何？","大腸。"],["膽為何在奇恆之腑中也出現？","依不同傳統分類原則，膽兼具特殊地位。"]],"read":[["N",51,"《靈蘭秘典論》"],["N",72,"《五藏別論》"]],"terms":[["Fu organs","腑"],["San Jiao","三焦"],["Extraordinary Fu","奇恆之腑"]],"contrast":"","practice":"不看資料寫六腑並連線配對五臟及心包。"},{"id":"F09","stage":"初階","topic":"經絡","title":"十二正經：名稱、配對與流注","minutes":45,"goal":"熟記十二經依次流注與手／足、陰／陽分類。","notes":["十二經順序：手太陰肺 → 手陽明大腸 → 足陽明胃 → 足太陰脾 → 手少陰心 → 手太陽小腸 → 足太陽膀胱 → 足少陰腎 → 手厥陰心包 → 手少陽三焦 → 足少陽膽 → 足厥陰肝 → 再回到肺。","記手三陰：肺（太陰）、心包（厥陰）、心（少陰）；手三陽：大腸（陽明）、三焦（少陽）、小腸（太陽）。足三陰：脾（太陰）、肝（厥陰）、腎（少陰）；足三陽：胃（陽明）、膽（少陽）、膀胱（太陽）。","背誦不能只背經名，還要能辨方向與表裡：手三陰由胸走手，手三陽由手走頭，足三陽由頭走足，足三陰由足走腹胸。這是傳統循行的概括，不是血管或神經的實際走向。","先把12經做成4組，每組3條；之後再學個別穴位與解剖定位。原書《針灸篇》p39–149 有十二經逐經章節入口，下方可直接點選。"],"memorize":["流注：肺大胃脾心小腸／膀腎包焦膽肝","四類方向：胸→手、手→頭、頭→足、足→胸腹","六對表裡經"],"questions":[["在「脾」之後是哪條經？","手少陰心經。"],["手少陽的臟腑名稱？","三焦。"],["足少陰是什麼經？","腎經。"]],"read":[["A",23,"十二經與奇經總論"],["A",39,"肺經作為第一條經的示例"],["A",120,"心包經"]],"terms":[["Primary channels","十二正經"],["Interior–exterior pair","表裡經"],["Channel circulation","經脈流注"]],"contrast":"","practice":"閉眼口述12經順序；看名稱說出手/足、陰/陽與表裡經。"},{"id":"F10","stage":"初階","topic":"經絡","title":"奇經八脈與任督二脈","minutes":35,"goal":"知道八脈名稱，先理解任督的循行概念。","notes":["奇經八脈：督脈、任脈、衝脈、帶脈、陰維脈、陽維脈、陰蹻脈、陽蹻脈。與十二正經的功能與命名方式不同。","督脈多描述背部正中、與陽經關聯；任脈多描述軀幹前正中、與陰經關聯。這是傳統描述；實際穴位位置、安全層次和禁忌需參照現代經穴學。","衝脈和帶脈、維脈和蹻脈需要待十二經熟悉後再精讀。不要一開始就背大量交會穴與針法配穴，否則難以保持概念清晰。","八脈交會穴是特定穴分類的一部分，屬中階記憶內容，與「八個奇經」是不同層級的知識。"],"memorize":["督任衝帶／陰維陽維／陰蹻陽蹻","任前督後（傳統主要循行概括）","八脈≠八脈交會穴"],"questions":[["奇經八脈的八個名稱？","督、任、衝、帶、陰維、陽維、陰蹻、陽蹻。"],["任督主要位於前後哪側？","任脈多以前正中為主，督脈多以後正中為主。"],["要不要在初階一次背完全部交會穴？","不必，先掌握名稱和循行。"]],"read":[["A",23,"任脈、督脈"],["A",150,"奇經八脈與針刺法"]],"terms":[["Extraordinary vessels","奇經八脈"],["Ren vessel","任脈"],["Du vessel","督脈"]],"contrast":"","practice":"畫人體前後輪廓，標上任與督，寫出八脈名稱。"},{"id":"F11","stage":"初階","topic":"特定穴","title":"五輸穴、原穴、絡穴、背俞穴與募穴","minutes":45,"goal":"先記類別，再記穴位，不背沒有來源的臨床配穴公式。","notes":["五輸穴按照經氣流注的傳統比喻為井、滎、輸、經、合。陰經五輸的五行配屬與陽經不同：陰經井木、滎火、輸土、經金、合水；陽經井金、滎水、輸木、經火、合土。","原穴（Yuan-Source points）按傳統理論與原氣相關；絡穴（Luo-Connecting points）與絡脈系統相關。學習每個穴位時記名稱、編號、經脈、定位、解剖相關結構與安全注意。","背俞穴（Back-Shu）主要分布在背部足太陽膀胱經；募穴（Front-Mu）主要分布於胸腹。名稱相似，但位置、類別與經絡編碼不同。","有些書將「俞」與「輸」混寫，須小心：五輸穴中的輸穴（Shu-Stream）與背俞穴（Back-Shu）不是同一概念。"],"memorize":["井滎輸經合","陰井木／陽井金","輸穴 Shu-Stream ≠ 背俞 Back-Shu"],"questions":[["陰經井穴屬哪一行？","木。"],["陽經合穴屬哪一行？","土。"],["「輸穴」與「背俞穴」一樣嗎？","不一樣，兩者是不同的特定穴分類。"]],"read":[["A",17,"井榮俞原經合分類"],["A",88,"膀胱經與背部穴位"],["A",166,"特定穴相關配伍內容"]],"terms":[["Five Shu points","五輸穴"],["Yuan-source point","原穴"],["Luo-connecting point","絡穴"],["Back-Shu point","背俞穴"],["Front-Mu point","募穴"]],"contrast":"","practice":"畫兩條五輸穴五行箭頭，對照陰經與陽經。"},{"id":"F12","stage":"初階","topic":"診斷","title":"四診與八綱辨證：從資料到假設","minutes":40,"goal":"區分「觀察到的現象」與「依中醫理論作出的證型假設」。","notes":["四診：望（inspection）、聞（listening/smelling）、問（inquiry）、切（palpation，包括脈診）。臨床資料必須充分蒐集，不可因單一舌象或脈象武斷下結論。","八綱是陰陽、表裡、寒熱、虛實四對。表裡討論傳統病位深淺，寒熱討論病性，虛實討論正邪盛衰與功能狀態；陰陽常作統攝。","證 pattern 是在中醫辨證框架中對一組症狀、體徵與病機作出的綜合判斷；病 disease 是疾病的分類，不可把「肝氣鬱結」直接翻譯成現代「肝病」。","案例練習（純教學）：主訴疲勞、畏寒時不能直接判定陽虛；還需檢視持續時間、睡眠、飲食、藥物、其他症狀，以及是否需要現代醫學評估。"],"memorize":["四診：望聞問切","八綱：陰陽表裡寒熱虛實","證 pattern ≠ 病 disease"],"questions":[["四診是哪四種？","望、聞、問、切。"],["八綱的四對？","陰陽、表裡、寒熱、虛實。"],["疲倦是否單憑一個症狀就能下中醫證型？","不能，需要整體病史與其他證據。"]],"read":[["N",96,"《脈要精微論》"],["N",110,"《平人氣象論》"]],"terms":[["Four examinations","四診"],["Eight principles","八綱"],["Pattern identification","辨證"]],"contrast":"","practice":"用任何無敏感資訊的假想例子，將「觀察」、「解釋」、「待查」分三欄。"},{"id":"I01","stage":"中階","topic":"辨證","title":"氣虛、血虛、陰虛、陽虛的比較","minutes":45,"goal":"學會四大常見證候概念及其不可一對一對應現代化驗的限制。","notes":["氣虛：傳統多關聯功能活動不足，如疲倦、氣短、乏力；但同樣症狀可有多種醫學原因，不能僅作中醫辨證。","血虛：傳統多描述濡養不足，如面色淡、頭暈、心悸等某些組合；與貧血診斷不是同義。","陰虛：傳統可表現為陰液不足、相對虛熱的推理；陽虛：傳統可表現為溫煦不足與虛寒的推理。兩者的寒熱並非以體溫高低單獨區分。","比較四證須列：關鍵定義、常見徵象、舌脈特點（課本來源）、相似與不同之處、需要排除的醫學風險。"],"memorize":["氣虛＝功能不足模型","血虛＝濡養不足模型","陰虛多虛熱；陽虛多虛寒（不是醫學診斷）"],"questions":[["為什麼血虛不等於貧血？","兩種診斷定義與依據不同，不能直接互換。"],["陰虛與陽虛最常用的比較方向？","滋潤／溫煦不足及傳統虛熱／虛寒的不同。"],["辨證還要留意什麼？","鑑別診斷與醫學紅旗徵象。"]],"read":[["N",54,"藏象與陰陽理論"],["N",152,"《臟氣法時論》"]],"terms":[["Qi deficiency","氣虛"],["Blood deficiency","血虛"],["Yin deficiency","陰虛"],["Yang deficiency","陽虛"]],"contrast":"","practice":"做四欄比較，分別補上症狀不足以單獨判斷的例子。"},{"id":"I02","stage":"中階","topic":"經絡","title":"經穴學習卡：如何正確記住每個穴位","minutes":40,"goal":"用同一模板學穴位：編號、位置、結構、類別、風險。","notes":["一個穴位至少分成七格：①中文／拼音／英文名 ②穴號（例如 LU9）③所屬經脈 ④骨性或肌腱表面標誌 ⑤相鄰神經血管及可能危險結構 ⑥傳統分類及主治 ⑦操作禁忌與需要督導處。","學習順序：先識別解剖表面標誌，再練「指認」和位置描述；實際進針深度、方向及手法必須按正規訓練進行，不可單憑歷史講稿自行操作。","不要一次背全身361個常用經穴。先以每經2–4個代表穴做經脈地圖，再按學校測驗範圍逐步增加。","常見錯誤是只背功效、不記安全；或只背古書寫法、不核對當代標準穴號。兩個問題都要避免。"],"memorize":["穴號＋定位＋解剖＋禁忌","先標誌後主治","名稱記憶不等於臨床操作資格"],"questions":[["一張安全的穴位卡至少要有哪三項？","編號、定位及危險結構（另需記經脈、分類、禁忌等）。"],["學完穴位能自己試針嗎？","不能，需正規訓練與適當督導。"],["初階每經應如何安排？","先選少量代表穴，建立整體經脈圖。"]],"read":[["A",39,"肺經穴位起點"],["A",45,"大腸經起點"],["D",1,"《針灸大成》古籍參考"]],"terms":[["Acupuncture point","腧穴"],["Surface anatomy","體表解剖"],["Needling safety","針刺安全"]],"contrast":"","practice":"使用學校教材建立 LU9、LI4、ST36 三張學習卡（不要自行練習針刺）。"},{"id":"I03","stage":"中階","topic":"特定穴","title":"背俞與募穴：名稱與椎節索引","minutes":45,"goal":"建立背俞穴名稱、穴號與傳統對應的腦內地圖。","notes":["常見背俞穴概覽：肺俞 BL13（T3）、厥陰俞 BL14（T4）、心俞 BL15（T5）、肝俞 BL18（T9）、膽俞 BL19（T10）、脾俞 BL20（T11）、胃俞 BL21（T12）、三焦俞 BL22（L1）、腎俞 BL23（L2）、大腸俞 BL25（L4）、小腸俞 BL27（S1）、膀胱俞 BL28（S2）。這些椎節是學習記憶點，非完整定位指引。","前募穴舉例：肺募中府 LU1、心募巨闕 CV14、肝募期門 LR14、脾募章門 LR13、胃募中脘 CV12、腎募京門 GB25。細節請依學校與標準穴位教材核對。","背俞與募穴的配對法屬傳統選穴學說，記憶階段先確認名稱與經脈，不急著背複雜治療組方。","背部、胸腹部有肺臟、胸膜、重要血管和其他深層組織，這部分的定位與深度屬高風險，歷史講義不可作為操作依據。"],"memorize":["BL13肺 T3、BL15心 T5、BL18肝 T9、BL20脾 T11、BL23腎 L2","BL14厥陰 T4、BL19膽 T10、BL21胃 T12","俞募是類別，不等於安全定位指南"],"questions":[["BL13是什麼？哪個椎節？","肺俞；T3棘突下水平。"],["BL23對應什麼？","腎俞；L2棘突下水平。"],["椎節標記是否足夠實際針刺？","不足，需要完整定位、風險知識及監督。"]],"read":[["A",88,"足太陽膀胱經和背俞"],["D",1,"《針灸大成》古籍對照"]],"terms":[["Back-Shu points","背俞穴"],["Front-Mu points","募穴"],["Thoracic vertebra","胸椎"]],"contrast":"","practice":"自測只看「肺心肝脾腎」，寫出 BL 穴號和椎節水平，再校對。"},{"id":"I04","stage":"中階","topic":"經典","title":"如何讀懂《黃帝內經》：原文、註解、異文","minutes":45,"goal":"避免把現代意譯、老師講義、英文翻譯誤當古代原文。","notes":["讀經典的最小單位是「一段原文」而非孤立名句。順序為：①確認書名（素問或靈樞）②篇名 ③原句 ④上下文 ⑤版本差異 ⑥白話譯文 ⑦在中醫理論中的意思。","示例：《素問·陰陽應象大論》「陰陽者，天地之道也，萬物之綱紀，變化之父母……治病必求於本。」可用來說明陰陽的理論框架。節錄是古籍文字，講義旁的臨床推論則另列。","示例：《素問·生氣通天論》「陰平陽秘，精神乃治」需讀原篇上下文，而不宜把它直接當成有實驗驗證的醫學療效結論。","你的筆記固定採「原文｜白話｜英中詞｜老師說法｜現代解剖或證據」五欄；若資料未核實就標記「待校對」。"],"memorize":["先核對《素問》或《靈樞》篇名","原文／譯文／講義分欄","引文留版本、頁碼、段落"],"questions":[["《陰平陽秘》出自哪一篇？","《素問·生氣通天論》。"],["老師的臨床解說可以當作古文原句嗎？","不行。"],["翻譯一段《內經》至少要核對什麼？","篇名、原句、上下文與版本。"]],"read":[["N",12,"《生氣通天論》"],["N",26,"《陰陽應象大論》"],["C",1,"原著彙編（請在原文內查篇名）"]],"terms":[["Primary text","原典"],["Commentary","註解"],["Textual variant","異文"]],"contrast":"","practice":"將「陰平陽秘」做成五欄對照，未確定的原文標示待校勘。"},{"id":"I05","stage":"中階","topic":"辨證","title":"六經辨證入門：太陽到厥陰","minutes":45,"goal":"先掌握六經名稱及六經辨證作為《傷寒論》的組織方式。","notes":["六經：太陽、陽明、少陽、太陰、少陰、厥陰。六經不是六條單純的解剖神經，也不應機械解讀成病情必依固定順序加重。","傳統教學常把太陽與表證及外感初期模式關聯；陽明與裡熱；少陽與樞機；太陰與裡虛寒；少陰與陰陽偏虛；厥陰與寒熱錯雜等做入門對照。這些是粗略導航，實際條文有更複雜的例外。","開始讀《傷寒論》不要先背藥方劑量，先用每經的「病機｜主症｜相關脈證｜容易混淆點」四欄做摘要。","《傷寒論》有多種版本與條文編排。若引用條文，須標記版本，不能把一位註家的解釋誤當成張仲景原文。"],"memorize":["太陽、陽明、少陽、太陰、少陰、厥陰","六經≠六條神經","入門先病機，經方細節留進階"],"questions":[["六經名稱請按順序說出。","太陽、陽明、少陽、太陰、少陰、厥陰。"],["六經是不是固定疾病進展階段？","不可如此機械理解。"],["初讀時先背什麼？","六經概念、病機、主症和鑑別。"]],"read":[["S",9,"太陽病開頭"],["S",89,"陽明相關篇章"],["S",131,"太陰相關篇章"]],"terms":[["Six stages","六經辨證"],["Taiyang","太陽"],["Yangming","陽明"],["Shaoyang","少陽"]],"contrast":"","practice":"畫六經比較表；每經只填核心概念，不抄一整頁講義。"},{"id":"I06","stage":"中階","topic":"五行","title":"五行在藏象與病機中的運用：慎用比喻","minutes":40,"goal":"能用五行說明古典理論，但不會以單一五行關係推導診斷。","notes":["五行對應可幫助記憶臟腑與季節、五志的連結，但要注意「類比系統」和「病因證據」不同。","相生模型的母子關係可作傳統病機詮釋，例如水生木；然而病人的具體症狀仍需透過四診與醫學鑑別，不可單憑生日、季節或五行推算疾病。","相乘／相侮的圖可作論述架構，正式課程應以教師採用的古籍及證型命名作版本標記。","練習五行思考時，將推理分三層：觀察資料、理論模型、需要進一步查證的替代解釋。"],"memorize":["五行是理論模型","相生相剋不等於因果證據","觀察、推理、證據要分開"],"questions":[["相生模型中的木之母為何？","水。"],["木之所剋為何？","土。"],["靠五行能單獨診斷癌症嗎？","不能。"]],"read":[["N",20,"《金匱真言論》"],["N",26,"《陰陽應象大論》"]],"terms":[["Analogy","類比"],["Pathomechanism","病機"],["Pattern","證"]],"contrast":"","practice":"任選一種五行解釋，列出至少兩項不能直接從中得出的醫學結論。"},{"id":"I07","stage":"中階","topic":"臨床推理","title":"一則醫案要怎樣讀才有用？","minutes":40,"goal":"從個案學推理，同時辨認證據不足。","notes":["讀醫案先標記事實：年齡、主訴、病程、既往病史、正在用藥、檢查結果、治療時序、後續追蹤。若原文缺少資料，就明確寫「未提供」。","再標記推論：這位作者為何判定該證？是否有其他可能？是否存在現代診斷或轉介問題？藥方或針刺主張是否經過充分安全評估？","不要從單一成功病例推論普遍有效，也不要從患者說「改善」就推論是某個特定處置造成。自然病程、同時治療、回歸平均、記憶偏差都可能影響結果。","理想的批判閱讀表：原文事實｜作者判斷｜另一種解釋｜缺失資料｜安全或倫理疑點｜目前仍不能得出的結論。"],"memorize":["醫案≠臨床試驗","事實與解釋分欄","先問「缺了什麼資料」"],"questions":[["病例改善能直接證明治療有效嗎？","不能；缺乏對照時不能排除其他因素。"],["醫案應先找出哪類資訊？","可確認的病史與觀察資料。"],["未記載的檢查可當作正常嗎？","不可以，應標記「未提供」。"]],"read":[["J",24,"《金匱》辨證論述作為理論背景"]],"terms":[["Case report","個案報告"],["Selection bias","選擇偏差"],["Differential diagnosis","鑑別診斷"]],"contrast":"","practice":"選一則匿名醫案，用六欄表寫下「事實／推論／缺口」。"},{"id":"I08","stage":"中階","topic":"醫學安全","title":"轉介與紅旗徵象：中醫學生必須掌握","minutes":40,"goal":"知道何時不能把不明症狀交給經絡或方藥理論獨立解釋。","notes":["突然胸痛、呼吸困難、臉歪、單側無力、語言不清、意識改變、嚴重過敏反應、無法控制的出血等，應依所在地緊急醫療流程處理。","持續或不明原因的出血、快速長大的腫塊、顯著體重下降、持續發燒等，應建議適當醫學評估，而非依書中疾病專題自行判斷。","針灸風險涉及感染、出血、暈針與少見但嚴重的氣胸等；穴位位於胸背、頸部及重要血管周圍時特別需要正式解剖學知識與督導。","你收藏的某些講義對癌症、糖尿病與現代檢查抱有強烈立場。這些內容應作「來源與主張分析」而非診療建議。"],"memorize":["急症：先評估與轉介","胸背針刺要重視氣胸風險","臨床安全優先於古籍詮釋"],"questions":[["突發單側無力要做什麼？","立即尋求緊急醫療評估。"],["原因不明的乳房腫塊能單靠傳統論述診斷嗎？","不能，需適當醫學評估。"],["為何胸背部定位特別重要？","涉及胸膜、肺臟及重要深部結構，存在嚴重傷害風險。"]],"read":[],"terms":[["Red flags","紅旗徵象"],["Pneumothorax","氣胸"],["Informed consent","知情同意"]],"contrast":"","practice":"列出五種需要立即轉介或加速醫學評估的情境。"},{"id":"A01","stage":"高階","topic":"傷寒論","title":"《傷寒論》精讀：條文、病機、方證對讀","minutes":45,"goal":"逐條讀原典，辨識註家解說與經方臨床風險。","notes":["精讀順序：先讀每經提綱與典型條文，做「條文要點｜症狀組合｜證型推理｜與其他經混淆處｜版本差異」表，再比較不同註解。","六經標籤不等於臨床上所有疾病的分類方式。研習六經以理解古代辨證系統為目標，不能把它當作足以取代感染性疾病或心血管疾病診斷的工具。","經方藥物具有禁忌、毒性、用藥交互作用和品質差異，不能憑歷史書的劑量自行配方。","練習閱讀《太陽病》篇時，每次只處理2–3條：原文摘要 → 老師詮釋 → 你的疑問 → 現代安全注意。"],"memorize":["六經條文要追版本","方證≠自我處方","一次精讀2–3條"],"questions":[["條文與註解要分開嗎？","要。"],["只靠《傷寒論》能替代現代疾病診斷嗎？","不能。"],["經方可以照古書自行服用嗎？","不可；需合格專業評估，注意毒性與交互作用。"]],"read":[["S",9,"太陽病脈證並治"],["S",41,"《傷寒論》太陽相關進階內容"]],"terms":[["Formula-pattern correspondence","方證相應"],["Classical formula","經方"]],"contrast":"","practice":"精讀兩條太陽病相關條文，填六欄比較，不記方藥劑量。"},{"id":"A02","stage":"高階","topic":"金匱要略","title":"《金匱要略》：雜病辨證與古代病名","minutes":45,"goal":"區分古代病名、現代疾病與傳統證型。","notes":["《金匱要略》以雜病類型為重要組織方式。學習從「臟腑經絡先後病脈證」起，建立古代病證敘述與現代臨床問診的比較。","古書中的消渴、虛勞、痰飲、水氣等術語是特定歷史語境的病證分類，不能與 diabetes、chronic fatigue、fluid overload 等現代診斷無條件畫等號。","每章都做「名詞｜古典定義｜主要症候｜病機｜與現代病名差異｜安全／轉介注意」對照表。","婦科章節、孕產相關病證與劇毒藥物尤其需要現代專業安全標準。"],"memorize":["古病名≠現代病名","先病機與鑑別，再方證","婦科與藥物安全優先"],"questions":[["消渴是否必然等於糖尿病？","不必然，定義與診斷標準不同。"],["研究雜病章最重要的比較是什麼？","古代病證與現代診斷的不同。"],["婦科章節可以自行照方用藥嗎？","不可。"]],"read":[["J",24,"臟腑經絡先後病脈證第一"],["J",42,"痙濕暍病脈證治法第二"]],"terms":[["Miscellaneous diseases","雜病"],["Historical disease category","古代病證類別"]],"contrast":"","practice":"挑一個古代病名，寫出「不能直接等同西醫診斷」的理由。"},{"id":"A03","stage":"高階","topic":"本草","title":"《神農本草經》：分類、四氣五味與安全","minutes":45,"goal":"理解本草學作為歷史知識系統，並能識別用藥風險。","notes":["傳統本草常按上、中、下經或四氣五味描述藥性；四氣一般指寒、熱、溫、涼，五味常指酸、苦、甘、辛、鹹。這套分類不等於現代藥物化學及安全性分級。","古籍中的「上品」不表示現代意義上的無毒，也不意味長期服用安全；某些礦物性藥材可涉及重金屬等嚴重風險。","研究一味藥只記：原書名稱、版本、歷史用途、現代身分鑑定、可能毒性與藥物交互作用。不要抄下配方後自行購買或調配。","讀書順序先看「藥性總義」（p20），再看三經結構（p36、p177、p261），不需要現在就背全部藥物條目。"],"memorize":["四氣寒熱溫涼；五味酸苦甘辛鹹","上中下經≠現代安全分級","禁忌、毒性與交互作用必核對"],"questions":[["四氣與五味？","寒熱溫涼；酸苦甘辛鹹。"],["「上品」等於可長期安全服用嗎？","不等於。"],["研讀本草時優先核對什麼？","藥材身份、毒性、交互作用與可信證據。"]],"read":[["B",20,"藥性總義"],["B",36,"上經"],["B",177,"中經"],["B",261,"下經"]],"terms":[["Materia medica","本草學"],["Four natures","四氣"],["Five flavours","五味"]],"contrast":"","practice":"做一張本草研究表，選一個傳統藥名只做文獻比較，不服用。"},{"id":"A04","stage":"高階","topic":"古籍與醫案","title":"《針灸大成》與歷史針法：比較而非照做","minutes":45,"goal":"將古代歌賦和穴法放回歷史語境，建立符合現代標準的判讀能力。","notes":["《針灸大成》匯集古代針灸論述與歌賦，對術語史、穴位分類、經脈理論有研究價值；它並非現代臨床安全手冊。","比較同一穴位時，優先建「古文描述｜老師解說｜當代穴號與標準定位｜解剖危險結構｜可考證與待考證」五欄。","歷史手法中的進針、放血、火灸、急救敘述可能含有嚴重風險；學術閱讀與臨床操作必須分開。","最終能力不是背下更多治療秘訣，而是能追溯每個主張的來源、說明不同資料的證據品質，並知道自己的專業界線。"],"memorize":["先追版本，再討論詮釋","古籍不是現代臨床操作手冊","穴位名稱、解剖與風險一併查證"],"questions":[["為何《針灸大成》不可直接當安全手冊？","其為歷史文獻，缺乏當代全部解剖、感染控制及現代安全要求。"],["比較同一穴位最重要的五欄？","古文、教學詮釋、標準定位、危險結構、待證疑點。"],["學習古籍的最終目的？","理解傳統學理，同時具備來源考證和安全批判能力。"]],"read":[["D",1,"《針灸大成》原著"],["A",150,"奇經和歷史針法章"]],"terms":[["Historical source","歷史文獻"],["Point nomenclature","穴位命名"],["Scope of practice","執業範圍"]],"contrast":"","practice":"同一穴位選一個古籍段落與學校教材對照，提出三個可查核問題。"}],"sources":{"N":{"name":"《黃帝內經》倪氏教學版","file":"01_黃帝內經_教學版.pdf","path":"【倪师教学版PDF】倪海厦人纪系列之黄帝内经.pdf","desc":"陰陽、五行、藏象與《素問》篇章；有授課者詮釋，不宜直接視為古籍校勘本","drive":"https://drive.google.com/file/d/1F_8TXisILBb0-TQcfSlwt8zF2gTB0Gc1/view"},"A":{"name":"《人紀針灸篇》文字實錄","file":"02_人紀針灸_文字實錄.pdf","path":"【文字实录PDF版】倪海厦人纪系列之针灸.pdf","desc":"經絡與穴位歷史教學材料；臨床建議需對照現代安全規範","drive":"https://drive.google.com/file/d/1VGmdxSztSmHet-iEhRjnB1olp3V5bbJw/view"},"S":{"name":"《傷寒論》倪氏教學版","file":"03_傷寒論_教學版.pdf","path":"【倪师教学版PDF】倪海厦人纪系列之伤寒论.pdf","desc":"六經辨證與經方思維的歷史授課版本","drive":"https://drive.google.com/file/d/1bjQCTUPe3MofbssXX-Hl8JGh4-UzMq-O/view"},"J":{"name":"《金匱要略》文字實錄","file":"04_金匱要略_文字實錄.pdf","path":"【文字实录PDF版】倪海厦人纪系列之金匮要略.pdf","desc":"雜病辨證與經方歷史教學版本","drive":"https://drive.google.com/file/d/1un_zHU5GI43Jf3_ULNjnkK5nd7hFT22Z/view"},"B":{"name":"《神農本草經》文字實錄","file":"05_神農本草經_文字實錄.pdf","path":"【文字实录PDF版】倪海厦人纪系列之神农本草经.pdf","desc":"傳統本草解說；不能作為安全性與療效的獨立依據","drive":"https://drive.google.com/file/d/17I_KIMJkHEHm8JFUNZhlTGfgTkeq6DNv/view"},"D":{"name":"《針灸大成》原著版本","file":"06_針灸大成_古籍.pdf","path":"【各课程用到的原著】针灸大成[明]杨继洲（高清文字版）.pdf","desc":"針灸古籍，包含古法；當代安全操作請依專業課本","drive":"https://drive.google.com/file/d/1yZyfyLcPwzmjGD9WgkZ9-eWBkZgzvapq/view"},"C":{"name":"《黃帝內經》原著彙編","file":"07_黃帝內經_原著彙編.pdf","path":"【各课程用到的原著】黄帝内经完整版.pdf","desc":"古籍整理版本，對照時仍需查核篇章與異文","drive":"https://drive.google.com/file/d/1hTVjNiuIFb9PxwXb5KSxplMFrcaDP6hx/view"}},"flashcards":[{"id":"F01-1","lesson":"F01","front":"「讀懂」與「背得出」差別是什麼？","back":"能不看資料自行解釋、比較並答題，才算可回憶。"},{"id":"F01-2","lesson":"F01","front":"醫案是否能單獨證明療效？","back":"不能，個案缺乏充分對照，需評估偏差、替代解釋與現代研究。"},{"id":"F01-3","lesson":"F01","front":"定位穴位時應優先依什麼？","back":"正式學校教材、現代解剖及專業安全標準。"},{"id":"F02-1","lesson":"F02","front":"列出陰陽四個核心關係。","back":"對立制約、互根互用、消長平衡、相互轉化。"},{"id":"F02-2","lesson":"F02","front":"「熱就是陽」是否在所有語境都不變？","back":"不是；陰陽屬相對範疇，需說明比較尺度與情境。"},{"id":"F02-3","lesson":"F02","front":"「陰平陽秘」在講什麼？","back":"以古典語言形容陰陽相互維持協調的狀態。"},{"id":"F03-1","lesson":"F03","front":"相生由「金」接到哪一行？","back":"水。"},{"id":"F03-2","lesson":"F03","front":"「土」剋誰？","back":"水。"},{"id":"F03-3","lesson":"F03","front":"相乘與相侮如何區分？","back":"相乘是沿相剋路徑過強；相侮是反向克制。"},{"id":"F04-1","lesson":"F04","front":"脾屬何行？所主的感官開竅？","back":"土，口。"},{"id":"F04-2","lesson":"F04","front":"五液配對順序？","back":"木淚、火汗、土涎、金涕、水唾。"},{"id":"F04-3","lesson":"F04","front":"水的五神與情志？","back":"志、恐。"},{"id":"F05-1","lesson":"F05","front":"氣機有哪些運動方向？","back":"升、降、出、入。"},{"id":"F05-2","lesson":"F05","front":"中醫「血虛」能否直接等於貧血？","back":"不能，需按不同診斷系統分別評估。"},{"id":"F05-3","lesson":"F05","front":"精與津液的主要概念差異？","back":"精側重生長發育與生命根本，津液側重滋養濡潤和體液代謝。"},{"id":"F06-1","lesson":"F06","front":"心主什麼？","back":"主血脈、藏神（傳統藏象論述）。"},{"id":"F06-2","lesson":"F06","front":"心包經的表裡經是哪一經？","back":"手少陽三焦經。"},{"id":"F06-3","lesson":"F06","front":"「心包」是否等同西醫解剖的全部心包膜功能？","back":"不是；傳統功能概念與解剖學名詞須區分。"},{"id":"F07-1","lesson":"F07","front":"哪一臟主運化？","back":"脾。"},{"id":"F07-2","lesson":"F07","front":"肺的兩種氣機作用方向？","back":"宣發、肅降。"},{"id":"F07-3","lesson":"F07","front":"腎的三項傳統功能？","back":"藏精、主水、納氣。"},{"id":"F08-1","lesson":"F08","front":"三焦在現代解剖是單一器官嗎？","back":"不是。"},{"id":"F08-2","lesson":"F08","front":"肺的表裡腑為何？","back":"大腸。"},{"id":"F08-3","lesson":"F08","front":"膽為何在奇恆之腑中也出現？","back":"依不同傳統分類原則，膽兼具特殊地位。"},{"id":"F09-1","lesson":"F09","front":"在「脾」之後是哪條經？","back":"手少陰心經。"},{"id":"F09-2","lesson":"F09","front":"手少陽的臟腑名稱？","back":"三焦。"},{"id":"F09-3","lesson":"F09","front":"足少陰是什麼經？","back":"腎經。"},{"id":"F10-1","lesson":"F10","front":"奇經八脈的八個名稱？","back":"督、任、衝、帶、陰維、陽維、陰蹻、陽蹻。"},{"id":"F10-2","lesson":"F10","front":"任督主要位於前後哪側？","back":"任脈多以前正中為主，督脈多以後正中為主。"},{"id":"F10-3","lesson":"F10","front":"要不要在初階一次背完全部交會穴？","back":"不必，先掌握名稱和循行。"},{"id":"F11-1","lesson":"F11","front":"陰經井穴屬哪一行？","back":"木。"},{"id":"F11-2","lesson":"F11","front":"陽經合穴屬哪一行？","back":"土。"},{"id":"F11-3","lesson":"F11","front":"「輸穴」與「背俞穴」一樣嗎？","back":"不一樣，兩者是不同的特定穴分類。"},{"id":"F12-1","lesson":"F12","front":"四診是哪四種？","back":"望、聞、問、切。"},{"id":"F12-2","lesson":"F12","front":"八綱的四對？","back":"陰陽、表裡、寒熱、虛實。"},{"id":"F12-3","lesson":"F12","front":"疲倦是否單憑一個症狀就能下中醫證型？","back":"不能，需要整體病史與其他證據。"},{"id":"I01-1","lesson":"I01","front":"為什麼血虛不等於貧血？","back":"兩種診斷定義與依據不同，不能直接互換。"},{"id":"I01-2","lesson":"I01","front":"陰虛與陽虛最常用的比較方向？","back":"滋潤／溫煦不足及傳統虛熱／虛寒的不同。"},{"id":"I01-3","lesson":"I01","front":"辨證還要留意什麼？","back":"鑑別診斷與醫學紅旗徵象。"},{"id":"I02-1","lesson":"I02","front":"一張安全的穴位卡至少要有哪三項？","back":"編號、定位及危險結構（另需記經脈、分類、禁忌等）。"},{"id":"I02-2","lesson":"I02","front":"學完穴位能自己試針嗎？","back":"不能，需正規訓練與適當督導。"},{"id":"I02-3","lesson":"I02","front":"初階每經應如何安排？","back":"先選少量代表穴，建立整體經脈圖。"},{"id":"I03-1","lesson":"I03","front":"BL13是什麼？哪個椎節？","back":"肺俞；T3棘突下水平。"},{"id":"I03-2","lesson":"I03","front":"BL23對應什麼？","back":"腎俞；L2棘突下水平。"},{"id":"I03-3","lesson":"I03","front":"椎節標記是否足夠實際針刺？","back":"不足，需要完整定位、風險知識及監督。"},{"id":"I04-1","lesson":"I04","front":"《陰平陽秘》出自哪一篇？","back":"《素問·生氣通天論》。"},{"id":"I04-2","lesson":"I04","front":"老師的臨床解說可以當作古文原句嗎？","back":"不行。"},{"id":"I04-3","lesson":"I04","front":"翻譯一段《內經》至少要核對什麼？","back":"篇名、原句、上下文與版本。"},{"id":"I05-1","lesson":"I05","front":"六經名稱請按順序說出。","back":"太陽、陽明、少陽、太陰、少陰、厥陰。"},{"id":"I05-2","lesson":"I05","front":"六經是不是固定疾病進展階段？","back":"不可如此機械理解。"},{"id":"I05-3","lesson":"I05","front":"初讀時先背什麼？","back":"六經概念、病機、主症和鑑別。"},{"id":"I06-1","lesson":"I06","front":"相生模型中的木之母為何？","back":"水。"},{"id":"I06-2","lesson":"I06","front":"木之所剋為何？","back":"土。"},{"id":"I06-3","lesson":"I06","front":"靠五行能單獨診斷癌症嗎？","back":"不能。"},{"id":"I07-1","lesson":"I07","front":"病例改善能直接證明治療有效嗎？","back":"不能；缺乏對照時不能排除其他因素。"},{"id":"I07-2","lesson":"I07","front":"醫案應先找出哪類資訊？","back":"可確認的病史與觀察資料。"},{"id":"I07-3","lesson":"I07","front":"未記載的檢查可當作正常嗎？","back":"不可以，應標記「未提供」。"},{"id":"I08-1","lesson":"I08","front":"突發單側無力要做什麼？","back":"立即尋求緊急醫療評估。"},{"id":"I08-2","lesson":"I08","front":"原因不明的乳房腫塊能單靠傳統論述診斷嗎？","back":"不能，需適當醫學評估。"},{"id":"I08-3","lesson":"I08","front":"為何胸背部定位特別重要？","back":"涉及胸膜、肺臟及重要深部結構，存在嚴重傷害風險。"},{"id":"A01-1","lesson":"A01","front":"條文與註解要分開嗎？","back":"要。"},{"id":"A01-2","lesson":"A01","front":"只靠《傷寒論》能替代現代疾病診斷嗎？","back":"不能。"},{"id":"A01-3","lesson":"A01" const D=window.STUDY;
const LS='tcm_mobile_v1';
const DAY=24*60*60*1000;
let app={page:'home',stage:'全部',query:'',cardStage:'全部',cardMode:'today',cardIdx:0,flipped:false,lesson:null};
function safeGet(){try{return JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){return {}}}
let store=safeGet();store.done ||= {}; store.cards ||= {}; store.review ||= {};
function save(){try{localStorage.setItem(LS,JSON.stringify(store))}catch(e){}}
function h(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function source(id,page){let s=D.sources[id];return s?.drive+(page?'#page='+page:'')}
function show(page,lesson){app.page=page;app.lesson=lesson||null;app.flipped=false;app.cardIdx=0;history.replaceState(null,'',page==='lesson'?'#'+lesson:'#'+page);render();window.scrollTo(0,0)}
function doneCount(){return D.lessons.filter(l=>store.done[l.id]).length}
function dueCount(){return D.flashcards.filter((c,i)=>{let k=store.cards[i];return k&&k.due<=Date.now()}).length}
function streak(){let seen=Object.keys(store.review).sort();return seen.length}
function lessons(stage,query){return D.lessons.filter(l=>(stage==='全部'||l.stage===stage)&&(!query||[l.id,l.title,l.topic,l.goal,...l.memorize].join(' ').toLowerCase().includes(query.toLowerCase())))}
function header(){const t={home:'學習首頁',curriculum:'章節課程',lesson:'正在學習',flash:'記憶卡',tables:'必背總表',library:'原書書庫',settings:'我的進度'};return `<div class="head"><div class="headrow"><div><div class="brand">TCM · STUDY COMPANION</div><div class="headtitle">${t[app.page]||'中醫針灸'}</div></div><div class="chip">手機版 1.0</div></div></div>`}
function panel(title,body){return `<section class="panel"><h2>${title}</h2>${body}</section>`}
function buttons(){const nav=[['home','⌂','首頁'],['curriculum','▤','課程'],['flash','◈','背卡'],['tables','▦','總表'],['library','▧','原書']];return `<nav class="bottom" aria-label="底部學習導覽"><div class="bottominside">${nav.map(([id,icon,t])=>`<button aria-label="${t}" aria-current="${app.page===id?'page':'false'}" class="${app.page===id?'on':''}" onclick="show('${id}')"><b>${icon}</b>${t}</button>`).join('')}</div></nav>`}
function home(){const next=D.lessons.find(l=>!store.done[l.id])||D.lessons[0];return `<div class="kicker">從今天開始 · 一次一章</div><h1 class="hero">每天讀一點，<br>慢慢建立中醫的脈絡。</h1><p class="lead">不用再翻找 128 個檔案。從今天要讀的章節開始，讀完就背卡、做題目。</p><div class="statrow"><div class="stat"><strong>${doneCount()}<small> / 24</small></strong><small>已讀章數</small></div><div class="stat"><strong>${dueCount()}</strong><small>到期複習卡</small></div><div class="stat"><strong>101</strong><small>記憶卡總數</small></div></div><div class="bar"><div style="width:${100*doneCount()/24}%"></div></div>${panel('下一章｜'+h(next.id)+' '+h(next.title),`<p class="subtle">${h(next.goal)}</p><button class="btn full" onclick="show('lesson','${next.id}')">打開這章 →</button>`)}${panel('每天固定 40 分鐘',`<ol><li><b>20分鐘｜讀課文：</b>只讀一章，先理解整體。</li><li><b>10分鐘｜閉卷回想：</b>用自己的話說三個要點。</li><li><b>5分鐘｜記憶卡：</b>測試真正記住多少。</li><li><b>5分鐘｜自測：</b>再做章末題目。</li></ol><div class="actions"><button class="btn alt" onclick="show('flash')">今日記憶卡</button><button class="btn flat" onclick="show('curriculum')">全部課程</button></div>`)}${panel('學習原則',`<div class="danger">歷史原典、倪氏講義、現代醫學證據要分開讀；穴位與臨床操作以正式學校訓練及安全規範優先。</div><p class="subtle">進度會盡可能儲存在目前使用的瀏覽器。若換手機、清除網站資料或使用無痕模式，請在「書庫 → 備份進度」匯出。</p>`)}<p class="subtle" style="text-align:center">手機版 · 24章 · 101張卡 · 7份Google Drive原始教材</p>`}
function curriculum(){const stages=['全部','初階','中階','高階'];const ls=lessons(app.stage,app.query);return `<div class="kicker">系統學習路線</div><h1 class="hero">章節總索引</h1><p class="lead">由初階 F01 開始，一次完成一章；中階和高階可以日後慢慢加入。</p><input id="search" class="search" type="search" placeholder="搜尋五行、心包、經脈、穴位…" value="${h(app.query)}" oninput="app.query=this.value;renderMain(false)" aria-label="搜尋課程"/><div class="filterrow">${stages.map(x=>`<button class="${app.stage===x?'on':''}" onclick="app.stage='${x}';render()">${x}</button>`).join('')}</div><p class="subtle">共 ${ls.length} 章｜已完成 ${doneCount()} / 24</p>${ls.map(l=>`<a class="listrow" href="#${l.id}" onclick="event.preventDefault();show('lesson','${l.id}')"><span class="chip ${store.done[l.id]?'done':''}">${l.id} · ${h(l.stage)}</span>${store.done[l.id]?'<span class="chip done">✓ 已完成</span>':''}<div class="lessonname">${h(l.title)}</div><small>${h(l.topic)} · 約 ${l.minutes} 分鐘</small></a>`).join('')||'<p>沒有符合的章節。</p>'}`}
function lesson(){let l=D.lessons.find(x=>x.id===app.lesson);if(!l)return curriculum();let idx=D.lessons.indexOf(l);let secs=l.notes.map((n,i)=>`<div class="note"><b>重點 ${i+1}</b><div>${h(n)}</div></div>`).join('');return `<a href="#curriculum" class="back" onclick="event.preventDefault();show('curriculum')">← 返回章節</a><div class="kicker">${h(l.stage)} / ${h(l.topic)} / ${l.id}</div><h1 class="hero">${h(l.title)}</h1><div class="lessonmeta"><span class="chip">${l.minutes} 分鐘</span><span class="chip ${store.done[l.id]?'done':''}">${store.done[l.id]?'✓ 已完成':'尚未完成'}</span></div><p class="lead"><b>學習目標：</b>${h(l.goal)}</p>${panel('① 讀這一章',secs)}${panel('② 必背重點',l.memorize.map(t=>`<div class="memory">${h(t)}</div>`).join(''))}${panel('③ 英中術語',l.terms.map(([en,zh])=>`<div class="mini"><b>${h(en)}</b>　${h(zh)}</div>`).join(''))}${panel('④ 閉卷測驗',l.questions.map(([q,a],i)=>`<details><summary>${i+1}. ${h(q)}</summary><div class="answer"><b>答案：</b>${h(a)}</div></details>`).join(''))}${panel('⑤ 讀原書（可選）',l.read.length?l.read.map(([id,p,desc])=>`<div class="source"><a target="_blank" rel="noopener" href="${source(id,p)}">${h(D.sources[id]?.name)} · PDF 第 ${p} 頁 ↗</a><small>${h(desc)}｜Google Drive 開啟；如頁碼未跳轉，請在 PDF 內手動輸入。</small></div>`).join(''):'<p class="subtle">這一章優先閱讀學校的現代醫學與安全教材。</p>')}${panel('⑥ 本章完成紀錄',`<label class="checklabel"><input type="checkbox" ${store.done[l.id]?'checked':''} onchange="store.done['${l.id}']=this.checked;save();render()"/> 已經閉卷答對至少 2／3 題</label><p class="subtle">複習建議：明天、第 3、7、14、30 天，搭配記憶卡重測。</p><div class="actions"><button class="btn alt" onclick="app.cardStage='${l.id}';show('flash')">背本章卡片</button><button class="btn" onclick="show('lesson','${D.lessons[idx+1]?.id||'F01'}')">${idx+1<D.lessons.length?'下一章 →':'回到第一章'}</button></div>`)}`}
function getCards(){let z=D.flashcards.map((c,i)=>({...c,index:i})).filter(c=>app.cardStage==='全部'||(app.cardStage==='初階'||app.cardStage==='中階'||app.cardStage==='高階'?D.lessons.some(l=>l.id===c.lesson&&l.stage===app.cardStage):c.lesson===app.cardStage));if(app.cardMode==='due')z=z.filter(c=>store.cards[c.index]&&store.cards[c.index].due<=Date.now());if(app.cardMode==='new')z=z.filter(c=>!store.cards[c.index]);if(app.cardMode==='today'){let due=z.filter(c=>store.cards[c.index]&&store.cards[c.index].due<=Date.now());let news=z.filter(c=>!store.cards[c.index]);z=due.concat(news.slice(0,8));}return z}
function cardView(){let cards=getCards();let c=cards[Math.max(0,app.cardIdx%Math.max(cards.length,1))];if(!c)return `<p class="subtle">這個卡組目前沒有卡片。可以切換「全部卡片」或選其他章節。</p><button class="btn" onclick="app.cardMode='all';render()">查看全部</button>`;return `<p class="subtle">第 ${app.cardIdx+1} / ${cards.length} 張 · ${c.lesson} · ${app.flipped?'答案':'題目'}</p><button class="flash ${app.flipped?'revealed':''}" onclick="app.flipped=!app.flipped;renderMain(false)" aria-label="翻開記憶卡"><span>${h(app.flipped?c.back:c.front)}</span><span class="hint">輕點卡片${app.flipped?'翻回題目':'查看答案'}</span></button>${app.flipped?`<div class="actions"><button class="btn alt" onclick="gradeCard(${c.index},false)">還不熟</button><button class="btn" onclick="gradeCard(${c.index},true)">記住了 ✓</button></div>`:`<div class="actions"><button class="btn alt" onclick="app.cardIdx=Math.max(0,app.cardIdx-1);app.flipped=false;renderMain(false)">← 上一張</button><button class="btn" onclick="app.flipped=true;renderMain(false)">顯示答案</button></div>`}`}
function gradeCard(i,pass){const old=store.cards[i]||{level:0};const level=pass?Math.min(5,old.level+1):0;let days=pass?[1,3,7,14,30][Math.max(0,level-1)]:1;store.cards[i]={level,due:Date.now()+days*DAY,seenAt:Date.now()};const date=new Date().toISOString().slice(0,10);store.review[date]=(store.review[date]||0)+1;save();app.flipped=false;app.cardIdx=(app.cardMode==='all'?app.cardIdx+1:0);renderMain(false)}
function flash(){let stages=['全部','初階','中階','高階',...D.lessons.map(l=>l.id)];return `<div class="kicker">主動回想 × 間隔複習</div><h1 class="hero">每天背一小組。</h1><p class="lead">先回答，再翻卡片。按「記住了」後會安排下一次複習；「還不熟」則較快再出現。</p><label class="field" for="cardStage">選卡組</label><select class="select" id="cardStage" onchange="app.cardStage=this.value;app.cardIdx=0;app.flipped=false;render()">${stages.map(x=>`<option value="${x}" ${app.cardStage===x?'selected':''}>${x==='全部'?'所有章節':x}</option>`).join('')}</select><div class="filterrow">${[['today','今日學習'],['due','到期複習'],['new','未背過'],['all','全部卡片']].map(([id,txt])=>`<button class="${app.cardMode===id?'on':''}" onclick="app.cardMode='${id}';app.cardIdx=0;app.flipped=false;render()">${txt}</button>`).join('')}</div>${panel('記憶卡',cardView())}<p class="subtle">同一瀏覽器的紀錄會保留。若重新下載新版本、換裝置或清除資料，請先從書庫備份進度。</p>`}
function tables(){const heads=['行','臟','腑','五官','五體','五液','五志','季節','五色','五味','五神'];const names=['木','火','土','金','水'];const phases=D.phases.map((row,i)=>`<div class="phase"><h3>${names[i]}｜${h(row[1])}</h3><div class="columns">${heads.slice(1).map((x,j)=>`<span>${x}</span><b>${h(row[j+1])}</b>`).join('')}</div></div>`).join('');return `<div class="kicker">長期背誦速查</div><h1 class="hero">必背總表</h1><p class="lead">先背整體排列，再逐條補細節。每次只背一張表。</p>${panel('五行完整對應表',`<p class="subtle">相生：木 → 火 → 土 → 金 → 水 → 木</p><p class="subtle">相剋：木 → 土 → 水 → 火 → 金 → 木</p>${phases}`)}${panel('十二正經循序',`<p>肺 → 大腸 → 胃 → 脾 → 心 → 小腸 → 膀胱 → 腎 → 心包 → 三焦 → 膽 → 肝</p>${D.meridians.map(m=>`<details><summary>${h(m[0])}｜${h(m[1])}</summary><p>分類：${h(m[2])} ${h(m[3])}</p><p>走向：${h(m[4])}</p><p>表裡：${h(m[5])}</p><a target="_blank" rel="noopener" href="${source('A',m[6])}">閱讀對應原書 PDF（第 ${m[6]} 頁）↗</a></details>`).join('')}`)}${panel('背俞穴',`<p class="danger">以下用於穴名與椎節學習，不能代替安全的臨床定位訓練。</p>${D.back.map(r=>`<div class="mini">${h(r[0])}（${h(r[1])}）｜${h(r[2])}</div>`).join('')}`)}`}
function library(){return `<div class="kicker">從主要資料返回原書</div><h1 class="hero">原書書庫</h1><p class="lead">這裡直接連到你的 Google Drive PDF，手機打開較方便。不必回 Box 逐一找檔案。</p>${Object.entries(D.sources).map(([id,s])=>`<a target="_blank" rel="noopener" href="${source(id,1)}" class="listrow"><span class="chip">PDF</span><div class="lessonname">${h(s.name)}</div><small>${h(s.desc)}</small><div style="margin-top:10px;color:#266657;font-weight:700">在 Google Drive 閱讀 ↗</div></a>`).join('')}${panel('備份或恢復學習進度',`<p class="subtle">建議每月備份一次。匯出 JSON 可在另一個瀏覽器的本學習中心匯入；雲端 PDF 與學習進度並非自動同步。</p><div class="actions"><button class="btn alt" onclick="exportProgress()">匯出進度</button><label for="importFile" class="btn flat" style="cursor:pointer">匯入進度</label><input id="importFile" type="file" accept=".json,application/json" onchange="importProgress(this.files[0])" hidden /></div><p class="subtle">已完成 ${doneCount()} / 24 章；曾學習 ${Object.keys(store.cards).length} 張卡。</p>`)}`}
function exportProgress(){const blob=new Blob([JSON.stringify({format:LS,created:new Date().toISOString(),data:store},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='中醫針灸_學習進度_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function importProgress(file){if(!file)return;let f=new FileReader();f.onload=()=>{try{let r=JSON.parse(f.result);if(r.format!==LS||typeof r.data!=='object')throw new Error('不相容');if(!confirm('要用匯入的學習進度覆蓋這部裝置目前的紀錄嗎？'))return;store=r.data;store.done||={};store.cards||={};store.review||={};save();alert('匯入完成');render()}catch(e){alert('匯入失敗：請選擇由這個學習中心匯出的 JSON 檔案。')}};f.readAsText(file)}
function renderMain(scroll=false){const el=document.querySelector('#main');if(!el)return;el.innerHTML=({home,curriculum,lesson,flash,tables,library})[app.page]?.()||home();}
function render(){document.querySelector('#app').innerHTML=`<div class="shell">${header()}<main id="main"></main></div>${buttons()}`;renderMain();document.title=(app.page==='lesson'?D.lessons.find(l=>l.id===app.lesson)?.title||'學習中心':'中醫針灸手機學習中心')+'｜中醫針灸';}
window.addEventListener('hashchange',()=>{let id=decodeURIComponent(location.hash.slice(1));const l=D.lessons.find(x=>x.id===id);if(l)show('lesson',id);else if(['home','curriculum','flash','tables','library'].includes(id))show(id);});
let fromHash=decodeURIComponent(location.hash.slice(1)); if(D.lessons.some(l=>l.id===fromHash)){app.page='lesson';app.lesson=fromHash}else if(['home','curriculum','flash','tables','library'].includes(fromHash)){app.page=fromHash}
render();
</script></body></html>
